name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev xvfb
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: GUI smoke test
        run: |
          set +e
          timeout 3s xvfb-run -a ./target/release/nirugame
          code=$?
          set -e
          test "$code" -eq 124
      - name: CLI smoke test
        run: |
          ./target/release/nirugame --version
          HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" \
            ./target/release/nirugame --list | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d["steam"], list)'
          HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" \
            ./target/release/nirugame --setup-plan all | grep -q 'NIRUGAME never runs this plan automatically'
