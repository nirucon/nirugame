[package]
name = "nirugame"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Retro-themed game launcher for NIRUX"
repository = "https://github.com/nirucon/nirugame"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
