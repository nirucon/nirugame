[package]
name = "nirugame"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Retro-themed game launcher for NIRUX"
repository = "https://github.com/nirucon/nirugame"

[dependencies]
x11rb = { version = "0.13", features = ["shm"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
png = "0.17"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
